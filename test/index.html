<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vinyl Deco Player – iPad test</title>
<style>
  body { margin:0; min-height:100vh; background:#141210; color:#e8dcc8; font-family:-apple-system,sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
  button { font-size:20px; padding:14px 28px; border-radius:12px; border:0; background:#1db954; color:#000; }
  #record { width:300px; height:300px; border-radius:50%; background:repeating-radial-gradient(#111 0 2px,#1c1c1c 2px 4px);
            display:flex; align-items:center; justify-content:center; animation:spin 1.8s linear infinite; animation-play-state:paused; }
  #record img { width:110px; height:110px; border-radius:50%; object-fit:cover; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #log { font:13px monospace; max-width:90vw; white-space:pre-wrap; opacity:.8; }
</style>
</head>
<body>
<div id="record"><img id="art" alt=""></div>
<div id="track">Not playing</div>
<button id="btn">Log in with Spotify</button>
<div id="log"></div>
<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
const CLIENT_ID = '6eb00e0688fa4353bfdf5f5cade2e7d9';
const REDIRECT = location.origin + location.pathname;
const SCOPES = 'streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state';
const TEST_TRACK = 'spotify:track:4uLU6hMCjMI75M1A2tKUQC';
const $ = id => document.getElementById(id);
const log = m => { $('log').textContent += m + '\n'; };

async function sha256b64(s) {
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return btoa(String.fromCharCode(...new Uint8Array(h))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function login() {
  const verifier = Array.from(crypto.getRandomValues(new Uint8Array(48)), b => b.toString(16).padStart(2,'0')).join('');
  localStorage.setItem('verifier', verifier);
  const q = new URLSearchParams({ client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT,
    scope: SCOPES, code_challenge_method: 'S256', code_challenge: await sha256b64(verifier) });
  location.href = 'https://accounts.spotify.com/authorize?' + q;
}
async function exchange(code) {
  const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ client_id: CLIENT_ID, grant_type: 'authorization_code', code,
      redirect_uri: REDIRECT, code_verifier: localStorage.getItem('verifier') }) });
  const j = await r.json();
  if (!j.access_token) throw new Error('Token error: ' + JSON.stringify(j));
  localStorage.setItem('token', j.access_token);
  history.replaceState(null, '', REDIRECT);
}

let player, deviceId;
function setupPlayer(token) {
  player = new Spotify.Player({ name: 'Vinyl Deco Player (iPad test)', getOAuthToken: cb => cb(token), volume: 0.8 });
  player.addListener('ready', ({ device_id }) => { deviceId = device_id; log('Player ready ✔'); });
  player.addListener('not_ready', () => log('Player went offline'));
  ['initialization_error','authentication_error','account_error','playback_error']
    .forEach(e => player.addListener(e, ({ message }) => log(e + ': ' + message)));
  player.addListener('player_state_changed', s => {
    if (!s) return;
    const t = s.track_window.current_track;
    $('art').src = t.album.images[0]?.url || '';
    $('track').textContent = t.name + ' – ' + t.artists.map(a => a.name).join(', ');
    $('record').style.animationPlayState = s.paused ? 'paused' : 'running';
  });
  player.connect().then(ok => log('connect: ' + ok));
}
async function play(token) {
  await player.activateElement();
  const r = await fetch('https://api.spotify.com/v1/me/player/play?device_id=' + deviceId, { method: 'PUT',
    headers: { Authorization: 'Bearer ' + token }, body: JSON.stringify({ uris: [TEST_TRACK] }) });
  log('play request: HTTP ' + r.status + (r.ok ? '' : ' ' + await r.text()));
}

(async () => {
  const code = new URLSearchParams(location.search).get('code');
  try { if (code) await exchange(code); } catch (e) { log(e.message); }
  const token = localStorage.getItem('token');
  if (!token) { $('btn').onclick = login; return; }
  log('Logged in ✔');
  $('btn').textContent = 'Tap to play test song';
  window.onSpotifyWebPlaybackSDKReady = () => setupPlayer(token);
  if (window.Spotify) setupPlayer(token);
  $('btn').onclick = () => deviceId ? play(token) : log('Player not ready yet, wait a moment');
})();
</script>
</body>
</html>

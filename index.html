<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vinyl">
<meta name="theme-color" content="#0d0b09">
<link rel="apple-touch-icon" sizes="180x180" href="icons/touch-180-v2.png">
<link rel="apple-touch-icon" href="icons/touch-180-v2.png">
<link rel="icon" type="image/png" href="icons/touch-192-v2.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Vinyl Deco Player</title>
<style>html.boot{background:#0d0b09}html.boot body{visibility:hidden}</style>
<script>
/* Update loader: asks version.json (never cached) which version is live and loads style.css, skins.css and app.js
   with ?v=<version>, so a new deploy shows up the next time the app opens or comes back to the front, without
   re-adding the Home Screen icon. Offline, or from file:// (tools/shot.mjs, tools/playtest.mjs), it uses the last known version. */
(function () {
  var d = document, root = d.documentElement, KEY = 'vdp.ver', ONCE = 'vdp.reloadedFor', current = null;
  function get(s, k) { try { return window[s].getItem(k); } catch (e) { return null; } }
  function put(s, k, v) { try { window[s].setItem(k, v); return window[s].getItem(k) === v; } catch (e) { return false; } }
  function latest() {
    if (location.protocol === 'file:' || !window.fetch) return Promise.resolve(null);
    var ctl = window.AbortController ? new AbortController() : null, t = setTimeout(function () { if (ctl) ctl.abort(); }, 2500);
    return fetch('version.json?t=' + Date.now(), { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { clearTimeout(t); return j && j.v ? String(j.v) : null; }, function () { clearTimeout(t); return null; });
  }
  function reloadFor(v) { // at most once per version and session, and only after remembering it, so it can never loop
    if (get('sessionStorage', ONCE) === v || !put('sessionStorage', ONCE, v) || !put('localStorage', KEY, v)) return false;
    location.reload(); return true;
  }
  function load(v) {
    current = v; if (v) put('localStorage', KEY, v);
    var q = v ? '?v=' + encodeURIComponent(v) : '', left = 2, started = false;
    function start() { // as before: app.js runs once the styles are in and the page is parsed
      if (started) return; started = true;
      root.className = root.className.replace(/(^|\s)boot(?=\s|$)/g, '');
      var s = d.createElement('script'); s.src = 'app.js' + q;
      if (d.readyState === 'loading') d.addEventListener('DOMContentLoaded', function () { d.body.appendChild(s); }); else d.body.appendChild(s);
    }
    ['style.css', 'skins.css'].forEach(function (f) {
      var l = d.createElement('link'); l.rel = 'stylesheet'; l.href = f + q;
      l.onload = l.onerror = function () { if (--left === 0) start(); };
      d.head.appendChild(l);
    });
    setTimeout(start, 4000);
  }
  root.className += ' boot';
  var known = get('localStorage', KEY);
  latest().then(function (v) {
    if (v && known && v !== known && reloadFor(v)) return; // new deploy since last time: reload once so index.html is fresh too
    load(v || known);
  });
  d.addEventListener('visibilitychange', function () { // back in front: look for a new deploy
    if (d.visibilityState !== 'visible') return;
    latest().then(function (v) {
      if (!v || v === current || (window.vdpBusy && window.vdpBusy())) return; // never interrupt music or a login refresh
      reloadFor(v);
    });
  });
})();
</script>
</head>
<body>
<div id="ambient"></div>

<main id="stage">
  <div id="plinth">
    <div id="deco"><i class="d1"></i><i class="d2"></i><i class="d3"></i><i class="d4"></i><i class="d5"></i><i class="d6"></i></div>
    <i class="screw" style="left:2.2%;top:2.9%"></i><i class="screw" style="right:2.2%;top:2.9%"></i>
    <i class="screw" style="left:2.2%;bottom:2.9%"></i><i class="screw" style="right:2.2%;bottom:2.9%"></i>

    <i class="hinge hl"></i><i class="hinge hr"></i>
    <div id="led"></div>
    <div id="powerknob"><i></i><b></b></div>
    <div id="pitch"><span class="lab">PITCH</span><b class="ps t">+8</b><b class="ps m">0</b><b class="ps b">−8</b><div class="slot"><div class="fader"></div></div></div>
    <div id="vfd" title="Tap: clock / time left"><span class="ghost">88:88</span><span id="vfdText"></span><i id="vfdMode"></i><i id="vfdSleep">SLEEP</i></div>
    <div id="badge"><b>VINYL</b><span>DECO · HI-FI</span></div>

    <div id="well"></div>
    <div id="platter">
      <div id="rim"></div>
      <div id="strobe"></div>
      <div id="mat"></div>
      <div id="disc">
        <div id="record">
          <div id="grooves"></div>
          <div id="label"><img id="art" alt="" crossorigin="anonymous"></div>
        </div>
        <div id="sheen"></div>
      </div>
      <div id="spindle"></div>
    </div>

    <div id="target"><i></i></div>
    <div id="armrest"><i></i></div>
    <div id="antiskate"><div class="dial"></div>ANTI-SKATE</div>
    <div id="armbase"><i class="scale"></i><div class="ring"></div><i class="hub"></i><i class="lift"><b></b></i></div>
    <div id="tonearm">
      <svg viewBox="-8 -12 20 56" width="20" height="56" aria-hidden="true">
        <defs>
          <linearGradient id="gm" x1="0" x2="1"><stop offset="0" style="stop-color:var(--a-lo)"/><stop offset=".3" style="stop-color:var(--a-mid)"/><stop offset=".48" style="stop-color:var(--a-hi)"/><stop offset="1" style="stop-color:var(--a-lo)"/></linearGradient>
          <linearGradient id="gw" x1="0" x2="1"><stop offset="0" style="stop-color:var(--w-lo)"/><stop offset=".22" style="stop-color:var(--w-mid)"/><stop offset=".36" style="stop-color:var(--w-hi)"/><stop offset=".55" style="stop-color:var(--w-mid)"/><stop offset="1" style="stop-color:var(--w-lo)"/></linearGradient>
          <radialGradient id="gc" cx=".35" cy=".3"><stop offset="0" style="stop-color:var(--a-hi)"/><stop offset=".6" style="stop-color:var(--a-mid)"/><stop offset="1" style="stop-color:var(--a-lo)"/></radialGradient>
          <linearGradient id="gh" x1="0" x2="1"><stop offset="0" style="stop-color:var(--h-lo)"/><stop offset=".5" style="stop-color:var(--h-hi)"/><stop offset="1" style="stop-color:var(--h-lo)"/></linearGradient>
          <linearGradient id="gg" x1="0" x2="1"><stop offset="0" style="stop-color:var(--cart-lo)"/><stop offset=".45" style="stop-color:var(--cart)"/><stop offset="1" style="stop-color:var(--cart-lo)"/></linearGradient>
        </defs>
        <!-- counterweight: stem, turned cylinder with grooves, end cap, accent band and scale ticks -->
        <rect x="-.55" y="-5" width="1.1" height="2" style="fill:url(#gm)"/>
        <rect x="-2.75" y="-11.7" width="5.5" height="7.2" rx=".9" fill="url(#gw)"/>
        <rect x="-2.75" y="-11.7" width="5.5" height=".95" rx=".6" style="fill:rgba(0,0,0,.4)"/>
        <g style="fill:rgba(0,0,0,.5)"><rect x="-2.75" y="-10.2" width="5.5" height=".2"/><rect x="-2.75" y="-9.1" width="5.5" height=".2"/><rect x="-2.75" y="-8" width="5.5" height=".2"/></g>
        <g style="fill:rgba(255,255,255,.38)"><rect x="-2.75" y="-10" width="5.5" height=".1"/><rect x="-2.75" y="-8.9" width="5.5" height=".1"/><rect x="-2.75" y="-7.8" width="5.5" height=".1"/></g>
        <rect x="-2.75" y="-6.9" width="5.5" height=".85" style="fill:var(--w-band)"/>
        <g style="fill:var(--w-tick)"><rect x="-2.3" y="-5.9" width=".14" height=".9"/><rect x="-1.55" y="-5.9" width=".14" height=".9"/><rect x="-.8" y="-5.9" width=".14" height=".9"/><rect x="-.07" y="-5.9" width=".14" height=".9"/><rect x=".66" y="-5.9" width=".14" height=".9"/><rect x="1.41" y="-5.9" width=".14" height=".9"/><rect x="2.16" y="-5.9" width=".14" height=".9"/></g>
        <circle cx="0" cy="-10.5" r=".38" style="fill:rgba(0,0,0,.55)"/>
        <path class="hit" d="M0 -6 L0 12 C0 21 3.2 23 3.2 31 L3.2 42" fill="none" stroke="transparent" stroke-width="5" pointer-events="stroke"/>
        <g class="arm-s">
          <path d="M0 -4 L0 12 C0 21 3.2 23 3.2 31 L3.2 35.5" fill="none" style="stroke:var(--t-lo)" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M0 -4 L0 12 C0 21 3.2 23 3.2 31 L3.2 35.5" fill="none" style="stroke:var(--t-mid)" stroke-width="1.05" stroke-linecap="round"/>
          <path d="M-.2 -4 L-.2 12 C-.2 21 3 23 3 31 L3 35.5" fill="none" style="stroke:var(--t-hi)" stroke-width=".3" stroke-linecap="round" opacity=".9"/>
          <rect x="-1" y="2.4" width="2" height=".7" rx=".25" style="fill:url(#gm)"/><rect x="-1" y="6.2" width="2" height=".4" rx=".2" style="fill:url(#gm)"/>
          <rect x="2.2" y="30" width="2" height=".45" rx=".2" style="fill:url(#gm)"/>
        </g>
        <g class="arm-x">
          <path d="M0 -4 L2.75 31 Q3.2 33.2 3.2 35.5" fill="none" style="stroke:var(--t-lo)" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M0 -4 L2.75 31 Q3.2 33.2 3.2 35.5" fill="none" style="stroke:var(--t-mid)" stroke-width="1.05" stroke-linecap="round"/>
          <path d="M-.2 -4 L2.55 31 Q3 33.2 3 35.5" fill="none" style="stroke:var(--t-hi)" stroke-width=".3" stroke-linecap="round" opacity=".9"/>
          <rect x="-.4" y="2.4" width="2" height=".7" rx=".25" transform="rotate(-4 .6 2.7)" style="fill:url(#gm)"/><rect x="-.4" y="6.2" width="2" height=".4" rx=".2" transform="rotate(-4 .6 6.4)" style="fill:url(#gm)"/>
          <rect x="2.2" y="30" width="2" height=".45" rx=".2" style="fill:url(#gm)"/>
        </g>
        <!-- headshell, cartridge, stylus, finger lift -->
        <path d="M1.9 35 L4.5 35 L5.1 41.8 L1.3 41.8 Z" fill="url(#gh)"/>
        <path d="M2.3 36 L4.1 36 L4.5 41.2 L1.9 41.2 Z" style="fill:rgba(255,255,255,.07)"/>
        <rect x="2.05" y="37.3" width="2.4" height="3.9" rx=".3" fill="url(#gg)"/>
        <rect x="2.05" y="37.3" width="2.4" height=".5" rx=".25" style="fill:rgba(255,255,255,.5)"/>
        <rect x="2.5" y="38.4" width="1.5" height=".16" style="fill:rgba(0,0,0,.35)"/>
        <rect x="1.7" y="35.8" width=".55" height=".55" style="fill:var(--a-mid)"/><rect x="4.1" y="35.8" width=".55" height=".55" style="fill:var(--a-mid)"/>
        <path d="M2.9 41.2 L3.6 41.2 L3.25 42.6 Z" style="fill:#d4d4d4"/>
        <circle class="tip" cx="3.25" cy="42.4" r=".55"/>
        <path d="M4.9 38.2 Q8.3 38.6 8.6 36" fill="none" style="stroke:var(--t-mid)" stroke-width=".5" stroke-linecap="round"/>
        <circle cx="8.6" cy="35.9" r=".42" style="fill:var(--t-mid)"/>
        <!-- pivot -->
        <circle cx="0" cy="0" r="2.5" style="fill:rgba(0,0,0,.35)"/>
        <circle cx="0" cy="0" r="2.3" fill="url(#gc)"/>
        <circle cx="0" cy="0" r="1.55" fill="none" style="stroke:rgba(0,0,0,.32)" stroke-width=".16"/>
        <circle cx="0" cy="0" r=".95" fill="none" style="stroke:rgba(255,255,255,.4)" stroke-width=".12"/>
        <circle cx="0" cy="0" r=".7" style="fill:var(--h-lo)"/>
      </svg>
    </div>

    <div id="lid"></div>

    <div id="ctl">
      <button class="pbtn" id="spd33" data-spd="33"><span>33</span></button>
      <button class="pbtn" id="spd45" data-spd="45"><span>45</span></button>
      <button class="pbtn wide" id="startstop"><span>START · STOP</span></button>
    </div>

    <span class="silk" id="silkDrive">DIRECT DRIVE · QUARTZ LOCK</span><span class="silk" id="silkSpeed">SPEED</span>

    <div class="foot f1"></div><div class="foot f2"></div>
  </div>

  <div id="nowplaying"><div id="title"></div><div id="artist"></div></div>
</main>

<div id="controls" class="hidden">
  <button id="bPlaylists" aria-label="Playlists"><svg viewBox="0 0 24 24"><path d="M4 6h12v2H4zm0 5h12v2H4zm0 5h8v2H4zm14-9v8.2a3 3 0 1 0 2 2.8V9h3V7z"/></svg></button>
  <button id="bShuffle" aria-label="Shuffle"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-3.1 4.4L8.8 16H4v-2h3.8l2.5-3.6L7.8 7H4V5h4.8l2.5 3.6L14 5h3zm0 10l4 4-4 4v-3h-2.2l-2-2.8 1.2-1.7 1.4 2H17z"/></svg></button>
  <button id="bPrev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg></button>
  <button id="bPlay" class="big" aria-label="Play / pause"><svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5v14l11-7z"/></svg></button>
  <button id="bNext" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/></svg></button>
  <button id="bDust" aria-label="Vinyl crackle"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm0 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM6.5 6.2l1 1.7-1.7 1-1-1.7zm11.3 9.6l1 1.7-1.7 1-1-1.7zM18 6l.9 1.8-1.8.9-.9-1.8z"/></svg></button>
  <button id="bTimer" aria-label="Sleep timer"><svg viewBox="0 0 24 24"><path d="M12 4a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 2a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm-1 2v5.4l4.2 2.5 1-1.6-3.2-1.9V8zM8 1h8v2H8z"/></svg></button>
  <button id="bSkin" aria-label="Turntables"><svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2v10h16V7zm6 1.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zm0 2.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm6.5-2.8 1.4.6-1.9 5.2-1.4-.5z"/></svg></button>
  <button id="bLid" aria-label="Glass lid"><svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5v2l-9-5-9 5zm2 4h14v6H5zm2 2v2h10v-2z"/></svg></button>
  <button id="bNight" aria-label="Night mode"><svg viewBox="0 0 24 24"><path d="M12.3 3a9 9 0 1 0 8.7 11.6A7 7 0 0 1 12.3 3z"/></svg></button>
  <input id="vol" type="range" min="0" max="100" value="70" aria-label="Volume">
</div>

<div id="sheet" class="hidden">
  <div id="sheetHead">
    <div id="tabs"><button data-tab="search">Search</button><button data-tab="playlists" class="on">Playlists</button><button data-tab="albums">Albums</button><button data-tab="recent">Recently played</button></div>
    <span id="count"></span><button id="sheetClose" aria-label="Close">✕</button>
  </div>
  <div id="lists"></div>
</div>

<div id="skinSheet" class="hidden">
  <div id="skinHead"><span>Turntables</span><button id="skinClose" aria-label="Close">✕</button></div>
  <div id="skinList"></div>
  <div id="discHead">Records</div>
  <div id="discList"></div>
</div>

<div id="connect" class="hidden">
  <button id="bConnect">Connect Spotify</button>
  <p>Spotify Premium needed. One login, then it remembers you.</p>
</div>

<div id="toast"></div>
<div id="dimmer"></div>
</body>
</html>
